name: Publish reviewed package
on:
  workflow_dispatch:
    inputs:
      package:
        type: choice
        required: true
        options: ['@o11/tracking', '@o11/cli']
      version:
        description: Exact version already committed in the selected package
        type: string
        required: true
      verify_only:
        description: Verify exact existing artifact without publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-publish-${{ inputs.package }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'o11-ai/o11-sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun install --ignore-scripts --frozen-lockfile
      - run: bun run build
      - run: bun test
      - run: bun check-types
      - run: bun run docs:check
      - name: Publish through package-scoped OIDC exchange
        env:
          RELEASE_PACKAGE: ${{ inputs.package }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          if [ "$RELEASE_VERIFY_ONLY" = "true" ]; then
            bun scripts/trusted-publish.ts "$RELEASE_PACKAGE" "$RELEASE_VERSION" --verify-only
          else
            bun scripts/trusted-publish.ts "$RELEASE_PACKAGE" "$RELEASE_VERSION"
          fi
